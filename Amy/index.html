<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amy's Birthday</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

  <!-- cache-bust -->
  <link rel="stylesheet" href="./style.css?v=3" />
</head>
<body>

  <main class="amy-main">
    <header class="amy-hero">
      <h1>Today is Amy's Birthday 🎉</h1>
      <p>Wishing you an amazing day full of love, laughter, and joy.</p>
    </header>

    <!-- photo grid -->
    <section class="amy-gallery" aria-label="Amy photo gallery">
      <a href="./amy1.jpeg"><img src="./amy1.jpeg" alt="Amy photo 1"></a>
      <a href="./amy2.jpeg"><img src="./amy2.jpeg" alt="Amy photo 2"></a>
      <a href="./amy3.jpeg"><img src="./amy3.jpeg" alt="Amy photo 3"></a>
      <a href="./amy4.jpeg"><img src="./amy4.jpeg" alt="Amy photo 4"></a>
      <a href="./amy5.jpeg"><img src="./amy5.jpeg" alt="Amy photo 5"></a>
      <a href="./amy6.jpeg"><img src="./amy6.jpeg" alt="Amy photo 6"></a>
      <a href="./amy7.jpeg"><img src="./amy7.jpeg" alt="Amy photo 7"></a>
      <a href="./amy8.jpeg"><img src="./amy8.jpeg" alt="Amy photo 8"></a>
    </section>

    <!-- hero image (optional) -->
    <section style="text-align:center; margin-top:16px;">
      <img src="./amy.jpeg" alt="Amy" style="max-width:min(720px, 92vw); border-radius:18px;">
    </section>

    <!-- music -->
    <section style="text-align:center; margin: 18px 0 8px;">
      <button id="music-btn" style="padding:10px 16px;border-radius:10px;border:none;cursor:pointer;">
        ▶️ Play music
      </button>
      <audio id="bgm" src="./amy.mp3" preload="auto" loop></audio>
    </section>

    <script>
      (function () {
        const btn = document.getElementById('music-btn');
        const audio = document.getElementById('bgm');
        let playing = false;

        const update = () => btn.textContent = playing ? '⏸️ Pause music' : '▶️ Play music';

        btn.addEventListener('click', async () => {
          try {
            if (!playing) { await audio.play(); playing = true; }
            else { audio.pause(); playing = false; }
            update();
          } catch (e) {
            console.log('Playback blocked until user interacts:', e);
          }
        });

        update();
      })();
    </script>
  </main>

</body>
</html>
